# Salesforce platform behaviour — the things that silently produce wrong answers.
#
# WHY THIS FILE EXISTS
# An agent operating a Salesforce org fails in a characteristic way: the API returns success
# and the outcome is still wrong. A field deploys and nobody can see it. A flow reads Active in
# one place and is absent in another. A "no-op" update rewrites who last touched 40,000
# records. None of that is exotic — it is the platform behaving exactly as documented, in ways
# that are easy to not know. This catalogue is the difference between an agent that knows the
# platform and one that has read about it.
#
# HOW TO READ AN ENTRY
# Every entry declares HOW IT IS KNOWN, because a catalogue that does not is a listicle:
#   confidence: verified-live  — re-checked against a real org by harness/checks/check_kb.py
#   confidence: documented     — Salesforce's own documentation says so; `source` names it
#   confidence: practitioner   — learned by being burned; no citation, stated as such
# `detect` is a command or query that answers "is this happening to me right now".
#
# ADDING AN ENTRY
# Required: id, domain, title, symptom, cause, remedy, confidence, updated.
# `verified-live` additionally requires `verify`, which the harness RUNS. Claiming
# verified-live without a runnable check fails the build — see check_kb.py.

meta:
  version: 1
  updated: 2026-08-01
  domains: [deploy, data, limits, security, automation, packaging, orgs, auth, api]

entries:

# ── DEPLOY / METADATA ──────────────────────────────────────────────────────────────────────
- id: fls-not-automatic
  domain: deploy
  title: No custom field deployed through the Metadata API receives field-level security
  symptom: >
    The deploy reports success, the field exists, and it is invisible in layouts, list views,
    reports and SOQL — for every profile, System Administrator included. It is usually
    misdiagnosed as a failed deploy or a caching problem.
  exception: >
    A UNIVERSALLY REQUIRED field is the exception, and the unqualified version of this entry was
    wrong about it. Field-level security is not modelled for required fields at all — measured on
    a live org, Account.Name and Account.OwnerId carry ZERO FieldPermissions rows while
    Account.Phone carries 169. They are always visible, so a required custom field does not arrive
    invisible, does not need a grant, and cannot be given one.
  cause: >
    Field-level security is not part of the CustomField metadata. Nothing grants it implicitly.
  remedy: >
    Ship a PermissionSet (or Profile) carrying fieldPermissions in the same deploy, then verify
    by querying FieldPermissions rather than by reading the deploy status.
  gotcha: >
    A formula field's entry must be <editable>false</editable> — formula fields are read-only
    and an editable=true entry fails the whole deploy. The boilerplate that works for every
    other field breaks on them.
  detect: "SELECT Field, Parent.Name FROM FieldPermissions WHERE Field = 'Account.My_Field__c'"
  # `metadata\s+CustomField` was here and matched on the metadata TYPE regardless of the verb,
  # so `project delete source --metadata CustomField` was told it needed a permission set. A
  # delete needs no field-level security, and a requirement set carrying things the operation
  # does not require misleads as surely as one that leaves things out. Dropped rather than
  # narrowed: the deploy case it was meant to catch is already covered by the first pattern.
  triggers: ['project\s+deploy.*(CustomField|fields/)', 'deploy:start.*CustomField', 'FieldPermissions', 'project\s+deploy.*manifest', 'deploy.*package\.xml']
  requires: >
    A CustomField alone is not a feature. To be usable it needs, in the same deploy: field-level
    security carried by a PermissionSet (or Profile) — nothing grants it implicitly — and, to be
    seen rather than merely queryable, a place on the page layout. Formula fields additionally
    need editable=false in the fieldPermissions or the whole deploy fails.
  confidence: verified-live
  verify: fls_absent_without_permset
  updated: 2026-08-01

- id: deleted-field-rename
  domain: deploy
  title: 'A deleted custom field is renamed with `_del`, and the API name is freed every time'
  symptom: >
    Re-creating a field with the name you just deleted works the first time and collides the
    second time, with no obvious difference between the two attempts.
  cause: >
    On delete Salesforce renames the field with a `_del` suffix and parks it in the
    deleted-fields queue for 15 days, where it still counts against the object's field limit.
    The original API name is freed immediately, and it is freed EVERY time: when `_del` is
    already taken Salesforce appends a number instead — `_del1`, `_del2` — so the same name
    can be created and deleted repeatedly. What accumulates is tombstones, each holding a
    slot against the limit until it ages out or is purged.
  remedy: >
    Use run-scoped field names in anything repeatable and purge rather than assume deletion —
    not because the name is blocked, but because every cycle leaves another tombstone
    consuming field-limit headroom on an object you did not think you were filling up.
  gotcha: >
    Corrected 2026-08-01. This entry previously claimed the name was freed EXACTLY ONCE — that
    a second delete could not append `_del`, so the field kept its original name and blocked
    reuse. Tested on a disposable org: deploy, delete, redeploy the same name, delete again.
    Every step succeeded and the second tombstone came back as `_del1`. The claim was folklore
    and it survived because the verifier only ever checked that a tombstone ends in `_del`,
    never the part about reuse.
  detect: 'sf data query --use-tooling-api --query "SELECT DeveloperName FROM CustomField WHERE TableEnumOrId=''Account'' AND DeveloperName LIKE ''%_del''"'
  triggers: ['project\s+delete\s+source', 'destructiveChanges', 'purge-on-delete']
  confidence: verified-live
  verify: del_tombstones_visible
  updated: 2026-08-01

- id: flow-retrieve-latest-only
  domain: deploy
  title: Retrieving a Flow returns only the latest version, so `<status>` is not activation
  symptom: >
    A retrieve shows `<status>Draft</status>` for a flow that is demonstrably running in the org.
  cause: >
    Since API v44 a Flow retrieve returns the latest version only. Cloning an active flow to
    edit it — the normal way flows are changed — makes the latest version a draft while an
    older version stays active.
  remedy: >
    Ask a definition-scoped question. Tooling `SELECT DeveloperName, ActiveVersionId FROM
    FlowDefinition`, or standard-API `FlowDefinitionView.IsActive`.
  detect: "sf data query --use-tooling-api --query \"SELECT DeveloperName, ActiveVersionId FROM FlowDefinition\""
  triggers: ['project\s+retrieve.*Flow', 'force:source:retrieve.*Flow', 'metadata\s+.?Flow:', 'retrieve.*Flow:']
  confidence: verified-live
  verify: flowdefinition_queryable
  updated: 2026-08-01

- id: flowdefinitionview-is-standard-api
  domain: deploy
  title: FlowDefinitionView is a standard-API object; querying it via Tooling errors
  symptom: >
    "Zero rows" from FlowDefinitionView, leading to the conclusion that the view is unreliable.
  cause: >
    It is not a Tooling object. Some clients surface the resulting error as an empty result set
    rather than as a failure.
  remedy: "Query it on the standard API. Do not pass --use-tooling-api."
  detect: "sf data query --query \"SELECT ApiName, IsActive FROM FlowDefinitionView\""
  triggers: ['FlowDefinitionView']
  confidence: verified-live
  verify: flowdefinitionview_standard_api
  updated: 2026-08-01

- id: deploy-order
  domain: deploy
  title: Deploy order is not cosmetic — dependencies fail in a fixed direction
  symptom: "Deploys fail with missing-component errors that disappear if you re-run them."
  cause: "Components reference each other, and the Metadata API resolves dependencies WITHIN a single payload but does not reorder across separate deploy calls."
  remedy: >
    Objects and fields first, then Apex, then permission sets — permission sets frequently
    carry classAccesses, so deploying them ahead of the classes they reference fails on a
    missing component. Then flows, then layouts and FlexiPages, then profiles last and
    minimal. Within one payload the API resolves this for you; across separate calls it is
    yours to get right.
  triggers: ['project\s+deploy', 'deploy:start']
  requires: >
    Metadata deployed out of order fails on dependencies that exist but are not yet visible.
    Objects and fields first; then permission sets, so FLS exists before anything references it;
    then Apex; then flows as Draft; then activation; then layouts and pages; profiles last and
    minimal.
  confidence: practitioner
  updated: 2026-08-01

- id: full-profile-deploy
  domain: deploy
  title: 'A profile deploy is an overlay, not a wipe — the danger is what the file SAYS, not what it omits'
  triggers: ['project\s+deploy.*Profile', 'deploy.*Profile:', 'metadata\s+Profile:']
  symptom: >
    Access disappears after a profile deployment, and the usual explanation — "the file did not
    mention it, so it was removed" — does not survive testing.
  cause: >
    A profile deployment applies what the file specifies and leaves unmentioned permissions
    alone. This entry previously claimed the opposite, that absence removes, cited to the
    Metadata API guide. That claim cannot be right: a retrieved profile contains permissions
    only for components in the package, so under a destructive-by-absence model every ordinary
    sparse retrieve-and-deploy would strip the target org, which plainly does not happen. The
    real mechanism is the reverse — a FULL profile export carries explicit readable=false and
    visible=false entries, and deploying it overwrites exactly what it does mention.
  remedy: >
    Deploy the narrowest profile file that expresses your intent, and read it for explicit
    false values rather than worrying about omissions. Prefer permission sets, which compose.
    Verify the specific grants you care about after the deploy rather than inferring from the
    deploy result.
  detect: 'sf data query --query "SELECT Field, Parent.Profile.Name FROM FieldPermissions WHERE Parent.IsOwnedByProfile = true LIMIT 5"'
  confidence: verified-live
  verify: profile_deploy_is_overlay
  gotcha: >
    Corrected 2026-08-01 after an experiment on a disposable Developer Edition org: two custom
    fields were granted profile FLS, a profile mentioning only the second was deployed, and the
    first field's grant survived. The entry had been `documented` with a citation that did not
    support it — which is how a plausible piece of folklore reaches a catalogue whose whole
    claim is that it re-checks itself.
  updated: 2026-08-01
- id: no-op-update-is-not-free
  domain: data
  title: A no-op update is a real write
  symptom: >
    A bulk "correction" that changed nothing still fires automation, and every touched record
    now shows the integration user as its last modifier.
  cause: >
    Salesforce does not diff before writing. An update with identical values still stamps
    LastModifiedDate and LastModifiedById, fires triggers, and fires flows whose entry criteria
    are not scoped to "only when updated to meet the condition".
  remedy: >
    Diff first and write only the records that actually change. Beyond the automation cost,
    rewriting LastModifiedById destroys "who last touched this" for the client's reporting.
  triggers: ['data\s+update', 'data:update', '--values']
  confidence: practitioner
  updated: 2026-08-01

- id: history-fields-unfilterable
  domain: data
  title: History objects cannot be filtered on NewValue / OldValue
  symptom: "\"field cannot be filtered in a query call\" on a *History object."
  cause: "Those fields are not filterable; the platform stores them polymorphically."
  remedy: "Select the rows you need by parent Id and date, then filter client-side."
  detect: "SELECT NewValue FROM AccountHistory WHERE NewValue = 'x'   -- expect an error"
  triggers: ['History\b', 'NewValue', 'OldValue']
  detect_expect: error
  confidence: documented
  source: "Salesforce Object Reference — History objects"
  updated: 2026-08-01

- id: hard-delete-permission
  domain: data
  title: Bulk API hard delete needs a user permission most integration users lack
  symptom: "A hard delete silently behaves like a normal delete, or the job fails outright."
  cause: "hardDelete requires the \"Bulk API Hard Delete\" user permission."
  remedy: >
    Grant it deliberately and narrowly. Note that a normal delete is recoverable from the
    Recycle Bin for 15 days and a hard delete is not — that difference is usually the reason
    someone wanted it, and also the reason to be careful.
  triggers: ['--hard-delete', 'hardDelete']
  requires: >
    A hard delete needs the "Bulk API Hard Delete" user permission granted to the running user
    before the job is submitted, and a decision made in advance that the records are not wanted
    back — a normal delete is recoverable from the Recycle Bin for 15 days and this is not.
  confidence: documented
  source: "Bulk API Developer Guide — hardDelete"
  updated: 2026-08-01

# ── LIMITS ─────────────────────────────────────────────────────────────────────────────────
- id: governor-limits-core
  domain: limits
  title: The synchronous limits that actually bite
  symptom: "\"Too many SOQL queries: 101\" or \"Too many DML statements: 151\" under load only."
  cause: >
    Per-transaction governor limits: 100 SOQL queries synchronous (200 asynchronous), 150 DML
    statements, 50,000 rows retrieved by SOQL, 10,000 records per DML operation, 6 MB heap
    synchronous (12 MB async), 10,000 ms CPU synchronous (60,000 ms async).
  remedy: >
    Bulkify: no SOQL or DML inside a loop, ever. These limits are per transaction, so code that
    passes with one record fails at 200 — which is exactly the batch size the platform uses.
  triggers: ['apex\s+run', 'apex:run', 'force:apex:execute', 'apex:execute', '--apexcodefile', '--file.*\\.apex']
  confidence: documented
  source: "Apex Developer Guide — Execution Governors and Limits"
  updated: 2026-08-01

- id: with-sharing-is-not-fls
  domain: security
  title: "`with sharing` enforces record access, not field or object access"
  symptom: >
    A security review finds that Apex marked `with sharing` still returns fields the running
    user cannot see.
  cause: >
    Sharing rules and FLS/CRUD are different systems. `with sharing` addresses only the first.
  remedy: >
    Run queries in USER_MODE (or use WITH SECURITY_ENFORCED), and strip inaccessible fields
    with Security.stripInaccessible before returning data.
  triggers: ['apex\s+run', 'apex:run', 'ApexClass']
  requires: >
    Apex that returns user data needs field and object access enforced explicitly: queries run
    in USER_MODE or carrying WITH SECURITY_ENFORCED, and Security.stripInaccessible applied
    before anything is returned. A sharing declaration does not supply this and cannot.
  confidence: documented
  source: "Apex Developer Guide — Enforcing Object and Field Permissions"
  updated: 2026-08-01

- id: formula-fields-bypass-fls
  domain: security
  title: A formula field can expose a field the user cannot read
  symptom: "A user sees a value derived from a field their profile denies."
  cause: >
    FLS is evaluated on the formula field itself, not on the fields it references.
  remedy: >
    Treat formula fields that reference sensitive data as sensitive, and set their FLS
    accordingly. This is a common finding in a client's first security review.
  triggers: ['PermissionSet', 'fieldPermissions']
  confidence: documented
  source: "Salesforce Help — Field-Level Security considerations"
  updated: 2026-08-01

- id: view-all-data-vs-fls
  domain: security
  title: '"View All Data" bypasses sharing but not field-level security'
  symptom: "An admin-adjacent profile can see every record but still not every field."
  cause: "The two controls are independent; VAD is a sharing-layer grant."
  remedy: "Do not use VAD to diagnose a missing field — check FieldPermissions."
  triggers: ['PermissionSet', 'PermissionSetAssignment', 'ViewAllData', 'FieldPermissions', 'Profile:']
  confidence: documented
  source: "Salesforce Help — User Permissions"
  updated: 2026-08-01

# ── AUTOMATION ─────────────────────────────────────────────────────────────────────────────
- id: order-of-execution
  domain: automation
  title: Order of execution decides whether your automation sees the value
  symptom: >
    A flow reads a field as empty that a trigger "already set", or a validation rule fires
    against a value that later automation would have corrected.
  cause: >
    Most of the order is fixed, and two places in it are not. Fixed: load and system validation,
    before-save flows, before triggers, custom validation rules, DUPLICATE RULES, save to the
    database (uncommitted), after triggers, assignment rules, auto-response rules, workflow rules
    — where a workflow field update re-runs before/after update triggers once more — escalation
    rules, after-save flows, ENTITLEMENT rules, roll-up summary to the parent, which itself runs
    the whole save procedure, then the grandparent, criteria-based sharing, COMMIT, and only then
    email, asynchronous Apex and asynchronous flow paths.
  not-guaranteed: >
    Two orderings are explicitly NOT guaranteed, and both are where people assume one. Multiple
    Apex triggers on the same object for the same event fire in no defined order, and Process
    Builder processes and workflow-triggered flows run in no defined order relative to each other.
    Anything depending on either is depending on a coincidence. An earlier version of this entry
    said "the order is fixed" without qualification, and omitted duplicate rules, entitlement
    rules, the grandparent roll-up and everything after COMMIT.
  remedy: >
    Choose the automation type by WHERE in that order it needs to run, not by preference.
    Same-record field updates belong in a before-save flow — no DML, and it runs before both
    validation and the save. Two consequences people are surprised by: a duplicate rule can block
    a save AFTER a before-save flow has computed everything, and nothing after COMMIT can be seen
    by a synchronous check that returns when the DML does.
  triggers: ['data\s+update', 'data\s+create', 'Flow', 'Trigger']
  confidence: documented
  source: >
    Apex Developer Guide — Triggers and Order of Execution;
    developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_triggers_order_of_execution.htm
  updated: 2026-08-01

- id: entry-condition-requirements
  domain: automation
  title: "\"Only when a record is updated to meet the condition\" will not re-fire"
  symptom: >
    A record already meeting the criteria is updated again and the flow does not run — which
    reads as a broken flow.
  cause: "That entry setting fires only on the transition into the condition, not while in it."
  remedy: >
    Pick the entry condition deliberately. It is also why a no-op mass update fires SOME
    automation and not other automation — the unconditioned kind runs, this kind does not.
  triggers: ['data\s+update', 'Flow']
  confidence: documented
  source: "Salesforce Help — Flow entry conditions"
  updated: 2026-08-01

# ── PACKAGING / NAMESPACE ──────────────────────────────────────────────────────────────────
- id: namespace-in-packaging-org
  domain: packaging
  title: The namespace prefix appears in the packaging org too, not only in subscriber orgs
  symptom: >
    Source says `Thing__c`, the org's describe says `ns__Thing__c`, and code written from the
    source names fails against the org it was developed in.
  cause: >
    Once a namespace is registered, the org applies the prefix to packaged components. The
    distinction is source-versus-org, not developer-versus-subscriber.
  remedy: >
    Resolve every API name against the org the code will run in, never against the repository.
    Unlocked/2GP packages built without a namespace carry no prefix anywhere, and packaged
    custom fields on STANDARD objects carry the prefix while the object does not.
  triggers: ['[A-Za-z][A-Za-z0-9]*__[A-Za-z0-9_]+__c', 'namespace', 'package\s+(create|version)']
  confidence: documented
  source: "Salesforce Developer Guide — Namespaces"
  updated: 2026-08-01

- id: managed-fields-immutable
  domain: packaging
  title: A subscriber cannot modify managed-package components
  symptom: >
    "Cannot modify managed object" on a deploy that looks harmless — often from changing a
    field set's description or label.
  cause: "Managed components are locked; even metadata that looks cosmetic is part of them."
  remedy: >
    Deploy managed field sets with their ORIGINAL description and label, and extend behaviour
    from subscriber-side components instead of editing packaged ones.
  triggers: ['[A-Za-z][A-Za-z0-9]*__[A-Za-z0-9_]+__c', 'managed', 'fieldSet', 'FieldSet']
  confidence: practitioner
  updated: 2026-08-01

# ── ORG TYPES ──────────────────────────────────────────────────────────────────────────────
- id: developer-edition-is-not-sandbox
  domain: orgs
  title: A Developer Edition org reports IsSandbox = false and is not production either
  symptom: >
    Tooling that classifies orgs as "sandbox or production" marks a Developer Edition org as
    production, and everything is blocked — or, worse, marks it writable by inverting the test.
  cause: >
    IsSandbox distinguishes sandboxes from everything else. Developer Edition, scratch orgs and
    trials are all "not a sandbox" without being production.
  remedy: >
    Classify with at least three values, reading OrganizationType and TrialExpirationDate as
    well as IsSandbox. Two-valued classification is wrong for a large fraction of real orgs.
  detect: "sf org display --target-org <alias> --json   # inspect isSandbox + organizationType"
  triggers: ['org\s+display', 'org:display', 'IsSandbox']
  confidence: verified-live
  verify: de_org_reports_not_sandbox
  updated: 2026-08-01

- id: sandbox-contains-real-data
  domain: orgs
  title: Full and Partial Copy sandboxes contain real production data
  symptom: >
    A "safe because it is a sandbox" bulk operation touches real customer records, including
    personal data.
  cause: >
    Only Developer and Developer Pro sandboxes are empty of production records. Full and
    Partial Copy are seeded from production, and Organization.IsSandbox cannot tell you which
    kind you are in.
  remedy: >
    Treat "sandbox" as insufficient grounds for a destructive operation. Confirm the sandbox
    TYPE, and remember that data masking is opt-in and frequently not configured.
  triggers: ['data\s+delete', 'delete\s+bulk', '--hard-delete']
  confidence: documented
  source: "Salesforce Help — Sandbox types and templates"
  updated: 2026-08-01

# ── AUTH / BROWSER ─────────────────────────────────────────────────────────────────────────
- id: frontdoor-session-handoff
  domain: auth
  title: frontdoor.jsp carries a live session in the URL, and some orgs refuse it
  symptom: >
    The handoff works everywhere except the one client org that matters, where it silently
    redirects to login.
  cause: >
    "Lock sessions to the IP address from which they originated" breaks the handoff whenever
    the browser's egress IP differs from the CLI's. Experience Cloud site sessions and
    Visualforce GETSESSIONID sessions are also unsupported for frontdoor.
  remedy: >
    Never echo the URL — it contains a live token that lands in shell history, browser history
    and the first-navigation Referer. Write it to a mode-0600 file and pass the path.
  triggers: ['frontdoor', 'secur/frontdoor', 'org\s+display.*--verbose', 's[i]d=']
  confidence: documented
  source: "Salesforce Help — frontdoor.jsp"
  updated: 2026-08-01

# ── API / VERSIONING ───────────────────────────────────────────────────────────────────────
- id: api-version-is-behaviour
  domain: api
  title: The API version on a class or flow changes its runtime behaviour
  symptom: >
    Identical-looking code behaves differently in two orgs, or after a retrieve/redeploy cycle.
  cause: >
    Each Apex class, trigger and flow stores the API version it was saved against, and the
    platform honours that version's semantics. A retrieve preserves it; hand-written metadata
    often does not.
  remedy: >
    Set the API version explicitly in generated metadata and keep it consistent, rather than
    inheriting whatever the tool defaults to.
  triggers: ['apiVersion', 'sourceApiVersion', '--api-version', 'project\s+(deploy|retrieve)']
  confidence: documented
  source: "Apex Developer Guide — Understanding API versions"
  updated: 2026-08-01

- id: three-releases-a-year
  domain: api
  title: Three releases a year means training data goes stale predictably
  symptom: "Confidently generated metadata that references an attribute the org rejects."
  cause: >
    Salesforce ships Spring, Summer and Winter releases. Anything a model learned about a
    recent API version is likely to be partly wrong, and hallucinated API names are the single
    most common cause of a failed deploy.
  remedy: >
    Describe before you reference. Verify every object, field and picklist value against the
    target org, not against memory or the repository.
  triggers: ['sobject\s+describe', 'CustomField', 'project\s+deploy']
  confidence: practitioner
  updated: 2026-08-01

- id: recycle-bin-retention
  domain: data
  title: 'A deleted record is recoverable for a bounded window, and which delete ran decides whether there is one'
  symptom: >
    Someone asks to 'undo' a delete and the answer depends entirely on which kind of delete ran.
  cause: >
    A normal delete moves records to the Recycle Bin, where they are restorable for up to 15
    days — extendable to 30 by Salesforce Support. Records in the bin do NOT count against the
    org's data storage allocation; what they occupy is the bin's own capacity, which is tied to
    storage, so the oldest entries are evicted when it overflows and a busy org can lose the
    undo before the window expires. A hard delete skips the bin entirely and is unrecoverable.
  remedy: >
    Prefer a normal delete and let the bin be the undo. Reserve hard delete for the cases that
    genuinely need it — a duplicate-key constraint, or bin capacity on a high-churn object — and
    say so out loud before running it, because there is no recovering from it.
  detect: 'sf data query --all-rows --query "SELECT COUNT() FROM Account WHERE IsDeleted = true"'
  triggers: ['data\s+delete', 'data:delete', '--hard-delete']
  confidence: documented
  source: 'Salesforce Help — Recycle Bin'
  updated: 2026-08-01

- id: de-daily-api-limit-masquerades
  domain: limits
  title: 'A Developer Edition org''s daily API cap fails checks that have nothing to do with each other'
  symptom: >
    REQUEST_LIMIT_EXCEEDED: TotalRequests Limit exceeded — and unrelated operations start
    failing together, intermittently, then pass when re-run in isolation
  cause: >
    Developer Edition allows a low daily request total on a rolling 24-hour window, and it is
    consumed by everything: SOQL, describe, Tooling, metadata deploys, even 'sf limits api
    display' itself, which means the org will not tell you how much is left once you are out. A
    harness that makes hundreds of calls per run walks into it, and because exhaustion is
    gradual the first symptom is two unrelated checks failing in the same run and passing when
    re-run alone.
  remedy: >
    Read the failure as an org-wide budget problem, not a defect in whichever check happened to
    report it. Space out full validation runs, and treat a limit error as its own outcome —
    distinct from a real failure — or you will spend the afternoon debugging code that is fine.
  detect: 'sf limits api display --target-org <alias>   # if this ITSELF errors, you are already out'
  triggers: ['limits', 'REQUEST_LIMIT_EXCEEDED', 'TotalRequests']
  confidence: practitioner
  updated: 2026-08-01

- id: self-join-forbidden
  domain: data
  title: 'A child of the same object cannot be counted with a semi-join'
  symptom: >
    MALFORMED_QUERY on a query of the shape SELECT COUNT() FROM Account WHERE ParentId IN
    (SELECT Id FROM Account WHERE ...)
  cause: >
    Salesforce refuses a semi-join whose subquery selects from the same object as the outer
    query. Self-referencing hierarchies — Account.ParentId, Case.ParentId, any custom
    self-lookup — therefore cannot be sized this way, which is exactly when you most want to
    size them: a delete that walks a hierarchy is the one whose scope is least obvious.
  remedy: >
    Fetch the parent Ids first and bind them as an explicit IN list, or walk the hierarchy level
    by level. Do not read the MALFORMED_QUERY as 'no children' — the query never ran.
  detect: 'sf data query --query "SELECT COUNT() FROM Account WHERE ParentId IN (SELECT Id FROM Account)"'
  detect_expect: error
  triggers: ['IN\s*\(\s*SELECT', 'NOT\s+IN\s*\(\s*SELECT']
  confidence: practitioner
  updated: 2026-08-01

- id: entity-types-that-refuse-count
  domain: api
  title: 'Some standard relationships can never be counted, and that is not a failure'
  symptom: >
    INVALID_TYPE_FOR_OPERATION, EXTERNAL_OBJECT_UNSUPPORTED_EXCEPTION, or a COUNT() that simply
    will not process on ProcessInstanceHistory, RecordActionHistory, PendingOrderSummary,
    ActivityHistory, OpenActivity, NoteAndAttachment, CombinedAttachment
  cause: >
    A describe call lists child relationships that are views over other data, external objects,
    or entity types the query engine does not serve. They appear identical to real children in
    childRelationships, so anything walking that list hits them and cannot tell a platform
    property from an error.
  remedy: >
    Classify them as uncountable rather than unknown. Treating them as failures makes every
    hierarchy report look incomplete forever, which trains the reader to ignore the warning that
    actually matters.
  triggers: ['SELECT\s+COUNT\(\s*\)']
  confidence: practitioner
  updated: 2026-08-01

- id: all-rows-is-a-cli-flag
  domain: api
  title: 'ALL ROWS in the SOQL text is rejected by the CLI; the flag is --all-rows'
  symptom: >
    MALFORMED_QUERY, unexpected token: 'ALL' — on a query that is valid SOQL and works from Apex
    or the API
  cause: >
    sf data query sends the statement to the query endpoint, and ALL ROWS is only honoured by
    queryAll. The CLI exposes that endpoint through --all-rows instead, so the SOQL keyword and
    the CLI are two different ways of asking and only one of them works here.
  remedy: >
    Drop ALL ROWS from the statement and pass --all-rows. Do not conclude the recycle bin is
    empty because the query errored — it never ran.
  detect: 'sf data query --all-rows --query "SELECT COUNT() FROM Account WHERE IsDeleted = true"'
  triggers: ['ALL\s+ROWS', 'IsDeleted\s*=\s*true']
  confidence: practitioner
  updated: 2026-08-01

- id: lightning-record-pages-css-error-headless
  domain: auth
  title: A Lightning record page can fail with "CSS Error" in headless Chromium while every other page renders
  symptom: >
    Automation opens /lightning/r/<Object>/<id>/view and gets navigation chrome, no record
    content, and a dialog headed "Sorry to interrupt". Home and Setup pages in the SAME session
    render perfectly, so the session, the auth and the permissions all look fine.
  cause: >
    The dialog body reads "CSS Error" — a static-resource/layout failure specific to the record
    page bundle. It is not access. Verified on a Developer Edition org 2026-08-04 with
    org-wide default Edit on Account, PermissionsRead true for the profile, the granting
    permission set assigned, and the field label confirmed against FieldDefinition.
  remedy: >
    Do not conclude anything about field-level security from a record page that did not render.
    Assert the record actually arrived — its own name or a highlights panel — before treating a
    missing field label as a permissions finding.
  ruled_out: >
    None of these fixed it, each tested once against the same org and record: a realistic
    viewport; the full bundled Chromium instead of the headless shell (channel chromium); the
    system Chrome (channel chrome); navigating on lightning.force.com instead of
    my.salesforce.com, confirmed by reading the settled URL host and path; and reloading, which
    is the remedy the error dialog itself offers. It fails identically for the ADMIN and for an
    impersonated user, so it is not about Login As. The org side is clear: org-wide default
    Edit, profile Read on the object, the granting permission set assigned, the field label
    confirmed against FieldDefinition, and the field temporarily placed on the layout.
    Unresolved from automation. The bisecting question is whether the same URL renders in the
    operator's own everyday browser: if it fails there too this is the org or the page layout,
    and if it renders there it is something about the frontdoor-token session or the automation
    context. That is a thirty-second human check and no amount of selector work substitutes.
  gotcha: >
    The header alone says nothing. Four detector designs were refined against this page before
    anyone read the dialog BODY, which names the cause in two words. When a page fails, read the
    error text before improving the selector.
  triggers: ['lightning/r/', 'Sorry to interrupt', 'CSS Error', 'record page']
  requires: >
    Verifying field visibility in a browser needs proof the record page rendered at all, not
    just that the Lightning shell did — the shell renders even when the record does not.
  confidence: practitioner
  updated: 2026-08-04

- id: login-as-servlet-beats-the-setup-link
  domain: auth
  title: Login As from the Setup UI link is unreliable; the su servlet is the path that works
  symptom: >
    Automation cannot find the "Login" link on a user detail page, or finds it and the click does
    nothing. Role and text locators report no such element even when an admin can see it.
  cause: >
    The Setup UI link is gated by the "Administrators Can Log In as Any User" org preference, it
    renders inside a Classic iframe, and in Lightning it sits behind shadow DOM — so a locator
    can miss it for three unrelated reasons at once, and the failure looks the same each time.
  remedy: >
    Drive the servlet directly:
    /servlet/servlet.su?oid=<org_id_18>&suorgadminid=<user_id_15>&retURL=%2F&targetURL=%2F —
    then navigate to a Lightning URL, because the servlet lands in Classic and an impersonated
    Classic page is not what an end user sees. The user Id must be truncated to FIFTEEN
    characters.
  gotcha: >
    The servlet still needs the org preference, and the failure is SILENT. Measured on a
    Developer Edition org 2026-08-04: with `enableAdminLoginAsAnyUser` false the browser simply
    STAYS on /servlet/servlet.su — no redirect, no error page — and a subsequent Lightning
    navigation renders perfectly as the ORIGINAL user. So "the Lightning shell rendered" is not
    evidence that impersonation happened, and a check asserting only the render reports a
    non-admin verification that never left the admin session. With the preference enabled the
    servlet redirects straight to the Lightning URL in retURL.
    The proof of impersonation is the "Logged in as" text. `servlet.sulogout` is NOT in the
    Lightning DOM at all, so the obvious href selector never matches there. And the banner
    renders LATER than `one-app-nav-bar`: sampled once at shell-ready it reports false on a
    session that is genuinely impersonating. Even polled for 15s it failed once in three runs, so
    treat this assertion as flaky and give it a generous settle window.
  detect_note: >
    enableAdminLoginAsAnyUser is readable and settable via the Metadata API as
    Settings:Security — retrieve it, flip the one element, deploy the whole file so every other
    preference deploys as a no-op.
  detect: "SELECT Id, Profile.Name FROM User WHERE IsActive = true"
  triggers: ['servlet\.su', 'suorgadminid', 'Login\s+As', 'sulogout', 'impersonat']
  requires: >
    Rendering as another user needs three things established first: the "Administrators Can Log
    In as Any User" preference enabled, a target user who is NOT the session's own user, and an
    assertion that the session is actually impersonating — the "Log out as" link, which
    Salesforce renders only while impersonating. Without the third, a failed hop is
    indistinguishable from a successful one.
  confidence: practitioner
  updated: 2026-08-04

- id: savepoint-rollback-does-not-refund-limits
  domain: limits
  title: A rollback restores the data and not the governor budget, and spends a statement of its own
  symptom: >
    A rehearsal that never commits still trips a governor limit, and the DML statement count
    after Database.rollback is HIGHER than it was before the savepoint was set.
  cause: >
    Savepoints and rollbacks are DML statements themselves. setSavepoint spends one, the DML
    spends one, Database.rollback spends a third, and the counter is not rewound when the data
    is. Nothing in the transaction reports this: the records really are gone, so the run looks
    free.
  remedy: >
    Budget a shadow run as costing MORE than the operation it rehearses, not less — three DML
    statements where the real thing spends one. An operation already near the limit cannot be
    safely rehearsed this way, and the rehearsal will fail for a reason that says nothing about
    whether the operation would have worked.
  gotcha: >
    Measured on a Developer Edition org, four runs, 2026-08-04: DML statements 0 → 2 → 3 and DML
    rows 0 → 1 → 1 across setSavepoint, one insert, and Database.rollback. Re-runnable with
    harness/experiments/shadow-rollback-boundary.py.
  triggers: ['setSavepoint', 'Database\.rollback', 'Savepoint\s+\w+\s*=', 'torque\s+shadow']
  requires: >
    A shadow or rehearsal run needs governor headroom for the savepoint, the DML and the
    rollback — three statements where the real operation spends one — so the headroom it needs
    is larger than the operation it is standing in for.
  confidence: practitioner
  updated: 2026-08-04

- id: tooling-api-refuses-permission-objects
  domain: api
  title: The Tooling API does not serve the permission objects, and says so only at run time
  symptom: >
    "sObject type 'FieldPermissions' is not supported" from a query that is valid SOQL and works
    without --use-tooling-api. Same for PermissionSetAssignment.
  cause: >
    FieldDefinition and EntityDefinition exist ONLY in the Tooling API; FieldPermissions,
    PermissionSet and PermissionSetAssignment are ordinary objects the Tooling endpoint does not
    serve. A verification routine that checks a field exists and then checks who can see it
    needs BOTH endpoints, and code that reaches for one helper reaches for one endpoint.
  remedy: >
    Pass --use-tooling-api per query, not per tool. Query FieldDefinition with it and
    FieldPermissions without it.
  gotcha: >
    This cannot be caught by testing against an org that does not resolve. Every query fails
    there for its own reason, so a layer that was never going to return a row looks identical to
    one that legitimately found nothing. It took one run against a real org, and the code had
    passed every offline check.
  triggers: ['use-tooling-api', 'FieldPermissions', 'PermissionSetAssignment', 'FieldDefinition']
  requires: >
    A check that a field is deployed AND visible needs two endpoints: FieldDefinition through
    the Tooling API, FieldPermissions and PermissionSetAssignment through the ordinary one.
  confidence: practitioner
  updated: 2026-08-04

- id: bulk-partial-failure
  domain: data
  title: 'A bulk job can complete successfully with thousands of failed records'
  symptom: >
    sf data update bulk / delete bulk exits 0, the job state is JobComplete, and the records
    were not written
  cause: >
    Bulk API reports job-level state, not record-level outcome. Rows that violated a validation
    rule, hit a required field, or lost a lock are recorded as failures INSIDE a completed job.
    Exit code and job state both say success because the job did run to completion — the
    question of whether the data changed is a separate query nobody makes.
  remedy: >
    Never treat a bulk exit code as evidence the data changed. Read the failed-record results
    for the job id, and compare a before and after count. This is the single most important
    habit in any mass update: success means the job finished, not that it worked.
  triggers: ['data\s+\w+\s+bulk', 'data:\w+:bulk', '--file\b.*\.csv']
  requires: >
    A bulk operation needs its per-record results read for the job id, and a before-and-after
    count compared, before anyone says the data changed. The exit code and the job state answer
    a different question — whether the job finished — and both say success when every row failed.
  confidence: documented
  source: 'Salesforce Bulk API 2.0 Developer Guide — Get Job Failed Record Results'
  updated: 2026-08-01

- id: sandbox-refresh-changes-orgid
  domain: orgs
  title: 'A sandbox refresh mints a NEW org Id, and anything keyed to the old one silently stops applying'
  symptom: >
    After a sandbox refresh, an allowlist entry, a saved credential, or a per-org note stops
    matching, with no error — the thing simply does not apply any more
  cause: >
    A refreshed sandbox is a new org that reuses the name. The 18-character Id changes, so every
    record keyed to the previous Id refers to an org that no longer exists. Nothing announces
    this, because from the platform's point of view nothing broke.
  remedy: >
    Treat the org Id as the identity and the alias as a nickname. Re-authorise and re-verify
    after any refresh. Where a tool keys authorisation to an org Id — Torque does — a refreshed
    sandbox correctly falls OUT of scope and must be re-approved, which is the safe direction
    but will look like a bug the first time.
  detect: 'sf org display --target-org <alias> --json   # compare the id against what you recorded'
  triggers: ['refresh', 'org\s+create\s+sandbox', 'sandbox.*(create|clone|delete)']
  confidence: practitioner
  updated: 2026-08-01

- id: prod-deploy-runs-tests
  domain: deploy
  title: 'A production deploy carrying Apex runs tests, and org-wide coverage gates it'
  symptom: >
    A deploy that validated in a sandbox in seconds takes an hour against production, or fails
    on coverage in code the change never touched
  cause: >
    A production deployment that CONTAINS Apex runs tests by default and is gated on 75%
    org-wide coverage — a property of the whole org, not of the change, so unrelated
    under-covered code can refuse a deploy that compiles perfectly. A payload carrying NO
    Apex components defaults to NoTestRun: no tests run and coverage is not evaluated at all.
    That difference is why one production deploy is instant and the next takes an hour.
  remedy: >
    Validate against production ahead of the window with a validate-only deploy, and use a
    quick-deploy afterwards so the tests are not paid for twice. Know the org's coverage before
    promising a deploy time.
  triggers: ['project\s+deploy', 'deploy:start', '--test-level']
  confidence: documented
  source: 'Salesforce Metadata API Developer Guide — Running Tests in a Deployment'
  updated: 2026-08-01

- id: flow-activation-on-deploy
  domain: automation
  title: 'Deploying a Flow marked Active does not reliably leave it active'
  symptom: >
    A flow deploys successfully, the file says Active, and the automation does not run
  cause: >
    Activation on deploy depends on org settings, the API version, and whether the target
    already has an active version — so the status in the file is a request rather than a
    guarantee. Deploy success reports that the metadata landed, which is a different question
    from which version is running.
  remedy: >
    Verify activation after every flow deploy by reading the active version back, not by
    trusting the deploy result or the file. Retrieve and check status, or read
    FlowDefinition.ActiveVersionId.
  triggers: ['(project|force:source|force:mdapi)\s*[: ]\s*(deploy|retrieve).*[Ff]low', 'metadata\s+Flow', 'Flow:[A-Za-z_]']
  confidence: practitioner
  updated: 2026-08-01

- id: unable-to-lock-row
  domain: data
  title: 'UNABLE_TO_LOCK_ROW is usually about a parent or a group, not the row you are writing'
  symptom: >
    A bulk update fails intermittently with UNABLE_TO_LOCK_ROW on a subset of batches, and
    re-running succeeds
  cause: >
    Writing a child locks its parent, and ownership changes take locks on group membership
    tables that are shared org-wide. Parallel batches touching children of the same parent
    therefore contend with each other even though no two batches share a record.
  remedy: >
    Order the batches so rows sharing a parent land together, or run serially. Re-running is not
    a fix — it changes the timing, so the same operation will fail again under load.
  triggers: ['data\s+\w+\s+bulk', 'OwnerId', 'data\s+update']
  confidence: documented
  source: 'Salesforce Help — Record Locking and Locking Errors'
  updated: 2026-08-01

- id: restricted-picklist-rejects-inactive
  domain: data
  title: 'A restricted picklist rejects values that are merely inactive, including ones already in the data'
  symptom: >
    A mass update fails on rows whose value looks legitimate — and is already stored on the
    record
  cause: >
    Deactivating a picklist value leaves it on existing records but removes it from what a write
    may set. A restricted picklist then refuses that value on any update, so rewriting a record
    with the value it already has can fail.
  remedy: >
    Check active values before a mass update, not the values present in the data. If a migration
    must preserve an inactive value, reactivate it for the load or drop the field from the
    update.
  triggers: ['data\s+update', '--values', 'picklist']
  confidence: practitioner
  updated: 2026-08-01

- id: purge-flag-belongs-to-deploy
  domain: deploy
  title: '--purge-on-delete is a deploy flag, not a delete flag'
  symptom: >
    sf project delete source --purge-on-delete fails with 'Nonexistent flag'
  cause: >
    Hard deletion is expressed as a destructive-changes deploy, so --purge-on-delete lives on sf
    project deploy start --metadata-dir, alongside destructiveChangesPost.xml. The delete-source
    command has no equivalent; it only ever soft-deletes.
  remedy: >
    Build a destructive manifest and deploy it with --purge-on-delete. And read the result: a
    teardown that falls back to delete source after a failed purge leaves a tombstone, which
    looks exactly like purge behaviour and will teach you the wrong lesson about what purge
    does.
  triggers: ['purge-on-delete', 'destructiveChanges', 'delete\s+source', 'project\s+delete']
  confidence: practitioner
  updated: 2026-08-01


# ── ADDED 2026-08-02 — derived from Salesforce's own documentation and confirmed against a
#    live org. Every claim below was established before it was written down, not after.

- id: audit-fields-not-writable
  domain: data
  title: CreatedDate and CreatedById cannot be set on insert unless the org has been opened for it
  symptom: >
    A migration that carries original timestamps loads without error and every record shows
    today's date and the integration user as creator. Nothing failed; the fields were dropped.
  cause: >
    CreatedDate, CreatedById, LastModifiedDate and LastModifiedById are not createable by
    default. The API does not reject a payload containing them — it ignores them, so the load
    reports success and the history is gone. Measured on a live org: describe returns
    createable=false and updateable=false for all four.
  remedy: >
    Enable "Set Audit Fields upon Record Creation" in User Interface settings and grant the
    corresponding user permission, then re-check the describe BEFORE the load rather than
    inspecting rows afterwards. The describe is the org's own answer to whether the load can
    work; a successful insert is not.
  detect: "SELECT QualifiedApiName, IsCreatable FROM EntityParticle WHERE EntityDefinition.QualifiedApiName = 'Account' AND QualifiedApiName IN ('CreatedDate', 'CreatedById')"
  triggers: ['CreatedDate', 'CreatedById', 'LastModifiedDate', 'LastModifiedById', 'data\s+import.*tree', 'bulk\s+upsert']
  requires: >
    A load carrying original timestamps needs the org setting "Set Audit Fields upon Record
    Creation" enabled AND the matching user permission granted, both established from the
    describe before the load rather than inferred from the result afterwards.
  confidence: verified-live
  verify: audit_fields_not_createable
  updated: 2026-08-02

- id: layout-required-is-not-api-required
  domain: data
  title: A field required on the page layout is not required to the API, and vice versa
  symptom: >
    Records created through the API skip a field the business believes is mandatory, or a load
    fails on a field no layout marks as required.
  cause: >
    There are two different mechanisms. Layout-level required binds the UI only. Universally
    required (required at the field definition) binds every write path including the API, and is
    what describe reports as nillable=false. Validation rules are a third, independent path.
  remedy: >
    Trust describe, not the layout: nillable=false is the only field-level requirement the API
    enforces. Before a load, list the non-nillable createable fields and make sure the payload
    carries every one of them.
  detect: "SELECT QualifiedApiName, IsNillable FROM EntityParticle WHERE EntityDefinition.QualifiedApiName = 'Account' AND IsNillable = false AND IsCreatable = true"
  triggers: ['data\s+import', 'data\s+create', 'required', 'nillable']
  requires: >
    A payload needs every non-nillable createable field on the target object. Layout-required is
    not the list; describe is.
  confidence: verified-live
  verify: nillable_is_the_api_contract
  updated: 2026-08-02

- id: restricted-picklist-rejects-new-values
  domain: data
  title: A restricted picklist refuses unknown values; an unrestricted one quietly accepts them
  symptom: >
    The same load succeeds on one picklist field and fails on another with INVALID_OR_NULL_FOR_
    RESTRICTED_PICKLIST, or succeeds everywhere and leaves values no report can group by.
  cause: >
    Restriction is per field, not per org. A restricted picklist rejects any value outside its
    value set. An unrestricted one accepts arbitrary text, which is worse than a failure because
    nothing surfaces it until someone builds a report. Describe exposes restrictedPicklist per
    field, and standard geo/state-country fields are typically restricted while ordinary custom
    ones are not.
  remedy: >
    Read restrictedPicklist and the active value set from describe before mapping data into a
    picklist, and treat an unrestricted picklist as a free-text field for validation purposes.
  detect: "sf sobject describe --sobject Account --json"
  detect-note: >
    Describe, not SOQL, and deliberately: neither EntityParticle nor FieldDefinition
    exposes a restricted-picklist column — both reject it as no such field. So this probe
    cannot be executed from a catalogue string, and is one of the accepted non-executable
    ones rather than a broken query.
  triggers: ['data\s+import', 'data\s+create', 'picklist', 'INVALID_OR_NULL_FOR_RESTRICTED']
  confidence: verified-live
  verify: picklist_restriction_is_visible
  updated: 2026-08-02

- id: duplicate-rules-block-the-save
  domain: automation
  title: A duplicate rule can block a save after every flow and trigger has already run
  symptom: >
    An insert fails with DUPLICATES_DETECTED, or a bulk load reports partial success with rows
    nothing in the payload explains. Re-running produces the same result on the same rows.
  cause: >
    Duplicate rules run at step 6 of the order of execution — after before-save flows, before
    triggers and custom validation, and before the record reaches the database. A blocking rule
    stops the save at that point, so work already done by earlier automation is discarded. Rules
    exist on a fresh org by default: standard Account, Contact and Lead rules ship active.
  remedy: >
    Query DuplicateRule for what is active on the object before a load, and expect the standard
    rules to be there even on an org nobody has configured. If a load must not be blocked, the
    rule has to be deactivated deliberately — not worked around by retrying.
  detect: "SELECT DeveloperName, IsActive, SobjectType FROM DuplicateRule WHERE IsActive = true"
  triggers: ['data\s+import', 'data\s+create', 'bulk\s+upsert', 'DUPLICATES_DETECTED']
  requires: >
    A data load that must not be blocked needs the active duplicate rules on that object
    established BEFORE the load, not after a partial failure — and a deliberate decision to
    deactivate them, not a retry loop.
  confidence: verified-live
  verify: duplicate_rules_are_visible
  updated: 2026-08-02

- id: post-commit-work-is-invisible-to-the-caller
  domain: automation
  title: Email, asynchronous Apex and asynchronous flow paths run after the call has already returned
  symptom: >
    A verification query immediately after a write shows none of the downstream effects, and the
    same query minutes later shows all of them. The write looks like it did nothing.
  cause: >
    Those steps sit after COMMIT in the documented order of execution. The synchronous call
    returns when the DML commits, which is strictly before that work runs.
  remedy: >
    Do not treat an immediate read-back as proof that downstream automation did or did not fire.
    Verify synchronous effects synchronously, and verify asynchronous ones by polling the object
    they land on, or AsyncApexJob, rather than by reading the parent record once.
  triggers: ['data\s+create', 'data\s+update', 'apex\s+run', 'Flow']
  confidence: documented
  source: >
    Apex Developer Guide — Triggers and Order of Execution, final step;
    developer.salesforce.com/docs/atlas.en-us.apexcode.meta/apexcode/apex_triggers_order_of_execution.htm
  updated: 2026-08-02
