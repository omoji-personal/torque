severity_modifiers:
  production_target:
    description: Target org is detected as production (via JSC_ORG_TYPE env, login
      URL, or alias pattern)
    effects:
    - escalate_required_manual_to_required_automated_or_block
    - require_serial_multi_profile_execution
    - require_audit_log_entry_per_login_as
    - require_qa_skip_token_for_any_skip
  sandbox_target:
    description: Target org is sandbox / scratch / dev
    effects:
    - default_severity_levels_apply
    - parallel_multi_profile_concurrency_allowed_with_max_3
