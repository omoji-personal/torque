schema_version: 1
last_updated: '2026-09-07'
notes: Generic Salesforce change taxonomy continued from JSC. Configure client-specific
  routes with TORQUE_QA_ROUTER; results describe coverage, not authorization.
surfaces:
  MetaAPI:
    description: Exact-job and artifact-scoped Metadata API deploy/validation verification;
      PASS requires the requested DeployRequest ID and every component supplied explicitly
      and/or by a strict SHA-256-fingerprinted local package.xml to report terminal
      success in the explicit target-org context
    status: production
    invocation: jsc-qa run <change-description> --org <alias> --deploy-job-id <0Af...>
      (--deploy-manifest <package.xml> and/or --deploy-component <TYPE:FULL_NAME>
      [...]) (invokes sf project deploy report --target-org <alias> --job-id <0Af...>
      --json; rejects manifest wildcards, never uses most-recent, and excludes package.xml
      pseudo-entries)
  Funct-Pl:
    description: Functional UI walkthrough via Playwright Python (scripted/CI lane).
      Uses Layer-1 UTAM-mirrored wrappers under jsc_browser_tests/library/lightning_components/
      + Layer-2 LightningPage thin core. Per docs/superpowers/specs/2026-05-21-sf-browser-testing-playwright-mcp-design.md
      (v3).
    status: production
    invocation: /qa-browser <flow> <org>
  Funct-MCP:
    description: Functional UI walkthrough via playwright-mcp (Claude-driven operator-UAT,
      turn-by-turn). Replaces chrome-devtools-mcp as the driver per design-v3 empirical
      benchmark on sample-dev 2026-05-21 (Lightning sub-tab click 130ms via playwright-mcp
      vs documented failure on chrome-devtools-mcp).
    status: production
    invocation: (operator/Claude drives mcp__playwright_* tools directly; install
      via `claude mcp add playwright "npx @playwright/mcp@latest"`)
  Funct-Inspect:
    description: "Non-driving inspection: Lighthouse audits, network request capture,\
      \ console history, accessibility snapshots via chrome-devtools-mcp. Narrowed\
      \ role per design-v3 \u2014 retired from primary-driver duty."
    status: production
    invocation: (operator/Claude drives mcp__plugin_chrome-devtools-mcp_chrome-devtools__*
      tools directly; Lighthouse via lighthouse_audit, network via list_network_requests,
      console via list_console_messages)
  Side-Eff:
    description: 'Side-effect verification: SOQL post-check + jsc_loganalyzer health
      score (packages/debug_log_analyzer)'
    status: production
    invocation: jsc_loganalyzer.cli --target-org <explicit-org>
  Parity:
    description: Cross-org per-field SOQL parity check (verify-deploy.py); DATA rows
      only
    status: production
    invocation: TORQUE_PARITY_SCRIPT with explicit TORQUE_BASELINE_ORG
  Vision:
    description: Gemini-3 vision analysis of screenshots captured by Funct-Pl / Multi-Prof
      runs
    status: production
    invocation: Optional configured screenshot analysis; client/provider scope required
  Multi-Prof:
    description: "Multi-profile UAT via Login As (admin \u2192 Standard User / Platform\
      \ User)"
    status: production
    invocation: /qa-multiprofile <flow> <org>
  Adv-Probe:
    description: "Editable Apex null/empty test drafts for direct public/global methods.\
      \ Every case contains an intentionally failing DRAFT assertion; replace it with\
      \ a business expectation before qualification. No generic bulk, governor or FLS\
      \ coverage is claimed. Generation returns MANUAL_REQUIRED, never a test PASS.\
      \ Triggers and unsupported signatures are surfaced for review."
    status: available_draft_generation
    invocation: "Auto-invoked when /qa change-description names .cls paths (.trigger\
      \ paths are filtered + surfaced as dropped \u2014 jsc_probes does not yet support\
      \ trigger-aware synthesis per R1-Codex-007). Also accessible directly: PYTHONPATH=packages/adversarial_probes\
      \ python3 -m jsc_probes.cli --target-class <file> --output <dir>. Honors JSC_QA_ADV_PROBE_MAX_FILES\
      \ (default 10, min 1), JSC_QA_ADV_PROBE_BUDGET_S (default 300, min 10), JSC_QA_ADV_PROBE_OUT\
      \ (default per-dispatch uuid'd subdir under $TMPDIR; if operator-set, must be\
      \ a writable directory; existing generated files are preserved)."
  Hook-Gate:
    description: PreToolUse hook gates (deploy_gate, namespace_touch_gate, knowledge_readonly_gate,
      revert_warning_pretool)
    status: deferred
    invocation: No global command hooks installed
  TAA:
    description: Multi-model adversarial audit (Claude + Gemini + Codex per multi-model-audit.md)
    status: production
    invocation: scripts/run-taa-audit.sh OR manual dispatch per multi-model-audit.md
    cost_warning: "EXPENSIVE \u2014 reserve for behavioral-rule changes + ship-gates\
      \ per multi-model-audit.md"
  Hostile-QA:
    description: Adversarial QA via hostile-qa-auditor subagent (Opus)
    status: production
    invocation: Agent dispatch with subagent_type=hostile-qa-auditor
    cost_warning: "EXPENSIVE \u2014 operator should opt-in; do NOT auto-dispatch on\
      \ every QA failure (per Gemini-R1-P0-1)"
  a11y:
    description: Accessibility automation (WCAG 2.1 AA via axe-core)
    status: deferred_phase_2_plus
    invocation: (not yet implemented)
  Visual-Reg:
    description: Visual regression baselines (screenshot diffing)
    status: deferred_phase_2_plus
    invocation: (not yet implemented)
  AI-Prompt:
    description: JSON output contract regression; local fixtures do not prove deployed
      AI behavior
    status: available_with_client_configuration
    invocation: jsc_ai_prompt_regression.cli replay-all <client-fixtures>
