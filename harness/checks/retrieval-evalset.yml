# Evaluation set for retrieval_quality — does the right entry actually fire?
#
# Held apart from knowledge/salesforce-platform.yml on purpose: the thing being measured must not
# write its own exam. Authored by an external reviewer (antigravity/gemini-3.1-pro) reading the
# entries, not the triggers' author.
#
# positives: a realistic `sf` command, and the entry that SHOULD fire for it.
# negatives: a realistic command where a named entry MUST NOT fire. This half matters more than
#            it looks — an entry that fires on everything teaches an operator to skim past every
#            note, which is worse than silence.
#
# Its first run found 7 entries that could never fire at all: no `triggers:` key, so no command
# could reach them. 18% of the catalogue, invisible, and no other check could see it.
positives:
- command: sf project deploy start --metadata CustomField:Account.X__c --target-org prod
  expect:
  - fls-not-automatic
  - deploy-order
  - three-releases-a-year
  why: deploying a field is exactly when its FLS gap matters
- command: sf project deploy start --source-dir force-app/main/default/objects/Account/fields/Bonus__c.field-meta.xml
    -o dev
