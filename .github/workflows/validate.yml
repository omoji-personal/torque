# Static profile on every push and PR.
#
# Why this exists: ROADMAP.md carried "66 checks" for eight commits while the harness ran 71,
# and nothing caught it because nothing ran on push. A repo whose thesis is that a green signal
# can still be a wrong outcome had no signal at all between an author's local runs.
#
# What this job is, and what it is NOT. It runs the STATIC profile only: no org, no secrets, no
# credentials. It therefore proves the refusal machinery, the fixtures, the fuzzer and the
# document-consistency checks — and proves NOTHING about org-touching behaviour. Deploys, the
# probe cycle, mass-update and browser render live in the capability and release profiles and
# still require an operator running against a disposable org. Per .claude/rules/validation.md a
# STATIC change needs the static profile only, so this gates exactly what it is entitled to gate
# and a green tick here must never be read as "release green".

name: validate

on:
  push:
  pull_request:

# A second push should cancel the first — the answer only matters for the tip.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: clean_ip's historical-blob path scans git objects, not just the
          # worktree, because a secret removed from HEAD is still a secret in the pack. That
          # path is operator-only here (see below), but a shallow clone would make a future
          # history-scanning check quietly vacuous rather than loudly skipped.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # Not a matrix, and deliberately not the floor. python_floor_is_real proves the 3.8
          # floor with ast.parse(feature_version=...), which needs no 3.8 interpreter installed,
          # so pinning old runtimes here would buy nothing the check does not already establish.
          python-version: '3.12'

      - name: Toolchain, recorded rather than assumed
        run: |
          python3 --version
          bash --version | head -1
          git --version

      # PyYAML is the harness's one third-party import, and it is worth being precise about
      # where it sits: the SECURITY path (hooks, gates, shellparse) is stdlib-only and stays
      # that way. This is needed by retrieval_quality, which reads the retrieval evaluation set
      # from YAML. The first CI run failed on exactly this and nothing else — "evaluation set
      # unreadable: No module named 'yaml'" — which is the check reporting FAIL for an
      # environment reason where the house taxonomy wants SKIP/BLOCKED with a stated cause.
      # Installing the parser is the honest fix: the eval set really is YAML, and a retrieval
      # measurement that silently did not run is the failure mode this repo exists to refuse.
      - name: Install the harness's non-stdlib dependencies
        # pyyaml: retrieval_quality reads the evaluation set from YAML.
        # pypdf:  check-guide-fresh.py reads the source hash the build stamps into the PDF.
        #         Without it that check silently falls back to comparing commit order, which is
        #         the weaker test it was written to replace — so the dependency is what keeps CI
        #         running the check it claims to run.
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml pypdf

      # The honest part. Three checks cannot reach their real conclusion in CI, and each must
      # read as non-green-but-explained rather than as a pass:
      #   clean_ip (×3 mutators)      — the denylist is private and absent here, so the check
      #                                 reports operator-only. It must not fail the job, and it
      #                                 must not be mistaken for having run.
      #
      #                                 THIS IS A REAL HOLE, not a formality, and something has
      #                                 already gone through it: a commit this workflow marked
      #                                 green was caught minutes later by an operator-mode run,
      #                                 for a term CI could not see. CI IS STRUCTURALLY BLIND TO
      #                                 THIS CLASS — the denylist cannot be committed, because
      #                                 publishing the list of denied terms would itself be the
      #                                 disclosure it exists to prevent.
      #                                 So: green here is NOT clearance to publish. A run on the
      #                                 operator's machine is the only thing that checks it.
      #                                 The fix is to put the denylist in an Actions secret and
      #                                 point TORQUE_DENYLIST at it (clean_ip names the FILE, not
      #                                 the matched term, so it does not leak into logs) — which
      #                                 needs C2 first, since that path is currently hardcoded to
      #                                 the author's Desktop. Until then this gap is open and
      #                                 stated rather than papered over.
      #   public_description_accurate — needs `gh` with auth; expected N/A.
      #   guards_share_no_blind_assumption — passes here for a reason worth writing down: an
      #                                 Actions checkout lives under $HOME, and this check
      #                                 assumes exactly that (docs/HANDOFF-DEFECTS-2026-08.md
      #                                 C9). It goes red only where the repo sits outside HOME.
      #                                 CI green is therefore NOT evidence that C9 is fixed.
      # sf CLI is deliberately NOT installed. Static fixtures are expected to deny before any
      # classification callout, because CI has no allowlist and an unauthenticated alias
      # classifies production — the fail-closed direction. If the first run shows a check that
      # needs sf reaching a wrong conclusion rather than an honest refusal, install it here
      # rather than skipping the check.
      # The skip is acknowledged, not hidden. operator_presence_can_succeed needs a real login
      # session in `who` to identify, and a CI runner has none — so it reports SKIP, the run is
      # DEGRADED, and this flag only buys a zero exit. The verdict line still says DEGRADED, on
      # purpose: no flag turns an unasked question into an answered one.
      #
      # Which means CI CANNOT cover that check, and the only place it runs is an operator's own
      # machine — precisely where the defect it was written for lived. Same shape as clean_ip
      # above. Both gaps are named here rather than left for someone to infer from a green tick.
      - name: Static profile
        run: |
          python3 harness/validate.py --profile static \
            --allow-skip="operator_presence_can_succeed:no login session on a CI runner; this check runs only on an operator machine"

      # The guide PDF is the artifact a reader downloads and the only one with no check on it:
      # claimed_counts and named_mutators_exist both scan guide/torque-guide.html and neither
      # scans the PDF. It shipped 45 commits behind its source, publicly claiming 59 checks and
      # 11 mutators against a real 72 and 15. This asks the cheap question — was it rebuilt after
      # its source last moved — which needs no PDF text extractor and no extra dependency.
      #
      # Freshness, not correctness. It cannot say the numbers are right, only that they came from
      # the current source. Correctness means adding the PDF to claimed_counts, which is owed.
      - name: Guide PDF is not stale relative to its source
        run: python3 scripts/check-guide-fresh.py

      # An attestation records exactly what a run did, and the newest one in this repo went
      # roughly sixty commits stale — because producing it was a hand operation, so it happened
      # rarely, on the artifact whose entire job is to be trustworthy.
      #
      # This is a STATIC attestation: no org, no secrets, and it says so in its own org field
      # rather than leaving a null a reader has to interpret. It is NOT a release attestation
      # and cannot be read as one — `.claude/rules/validation.md` requires an all-PASS release
      # entry for publication, and that still needs an operator and a disposable org.
      #
      # Written outside the repo on purpose. The clean-tree assertion below exists to catch a
      # mutator that failed to restore a hook, and an attestation committed into harness/attest/
      # would trip it with a file that is not residue.
      #
      # Exit codes are NOT all the same failure. `torque attest` returns 2 when it refuses to
      # write — a parse mismatch, a verdict disagreeing with an exit code, no check outcomes at
      # all — and that is a real defect in the artifact and fails this job. It returns 1 when it
      # wrote a complete attestation whose verdict was not PASS, and on this runner that is the
      # expected state: the gating "Static profile" step above declares one allowed skip
      # (operator_presence_can_succeed, which needs a login TTY), and `torque attest` re-runs the
      # profile WITHOUT that declaration, so it lands on DEGRADED every time. Failing the job on
      # exit 1 would mean CI is red for a condition the gate above already ruled on.
      #
      # The artifact is still accurate: it lists that check with outcome SKIP. What it does not
      # carry is the declared REASON, because `torque attest` has no --allow-skip to forward.
      # That flag is the actual fix and it is OWED — bin/ is outside the agent write surface, so
      # it needs the operator. Until then this comment is where the reason lives, which is worse
      # than the attestation carrying it and better than nobody being told.
      - name: Static attestation
        run: |
          set +e
          python3 bin/torque attest --profile static --out "$RUNNER_TEMP/attest"
          rc=$?
          set -e
          if [ "$rc" -ge 2 ]; then
            echo "::error::torque attest refused to write an attestation (exit $rc)"
            exit "$rc"
          fi
          # An attestation step that produces no attestation has failed regardless of exit code.
          ls "$RUNNER_TEMP"/attest/*.json >/dev/null
          cat "$RUNNER_TEMP"/attest/*.json
          if [ "$rc" -ne 0 ]; then
            echo "::notice::attestation recorded a non-PASS verdict (exit $rc); see the artifact"
          fi

      - name: Upload the attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torque-static-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/attest/*.json
          if-no-files-found: warn

      # The static profile includes --self-test, which MUTATES HOOK SOURCES IN PLACE and
      # restores them in a finally. If a restore is ever missed, the mutation is a source edit
      # that would ride along in the next commit — a neutered guard, merged silently, which is
      # the worst outcome this repo has. The runner is ephemeral, so this assertion is the only
      # thing standing between that and a green tick.
      - name: Working tree must be clean after self-test
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::self-test left residue in the working tree — a mutated guard may be uncommitted"
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "clean — every mutator restored what it neutered"
