name: Validate Torque
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python workflows/sync_adapters.py --check
      - run: python scripts/sync-workflows.py --check
      - run: python scripts/check-provenance.py
      - run: python scripts/test-offline.py -q
      - run: python -m build
      - run: python scripts/check-distribution.py dist/*.whl --sdist dist/*.tar.gz
      - name: Verify the installed wheel outside the source checkout
        run: |
          python -m venv work/wheel-venv
          work/wheel-venv/bin/python -m pip install dist/*.whl
          work/wheel-venv/bin/python -m pip check
          work/wheel-venv/bin/python scripts/smoke-installed.py --require-wheel
      - name: Keep reviewed candidate artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: torque-candidate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
